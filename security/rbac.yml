apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-list-sa
  namespace: todoapp


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: todoapp
  name: todo-list-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todo-list-rolebinding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: todo-list-sa
  namespace: todoapp
roleRef:
  kind: Role
  name: todo-list-role
  apiGroup: rbac.authorization.k8s.io